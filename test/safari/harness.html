<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yomitan SQLite backend — Safari checks</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
        li.ok::marker { content: "✔ "; color: green; }
        li.fail::marker { content: "✘ "; color: red; }
        pre { color: #b00; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Yomitan SQLite backend — Safari checks</h1>
    <p id="status">Running…</p>
    <ul id="results"></ul>

    <script type="module">
        // The OPFS SAH-Pool VFS needs synchronous access handles, which WebKit only exposes in a
        // worker — so the whole backend runs inside a module worker, exactly like the DB worker
        // does in the extension.
        const statusElement = document.querySelector('#status');
        const resultsElement = document.querySelector('#results');

        /**
         * @param {{name: string, ok: boolean, error?: string, info?: string}[]} checks
         */
        function render(checks) {
            for (const check of checks) {
                const item = document.createElement('li');
                item.className = check.ok ? 'ok' : 'fail';
                item.textContent = check.name + (check.info ? ` — ${check.info}` : '');
                if (!check.ok) {
                    const pre = document.createElement('pre');
                    pre.textContent = check.error ?? '';
                    item.append(pre);
                }
                resultsElement.append(item);
            }
            const failed = checks.filter((check) => !check.ok).length;
            statusElement.textContent = failed === 0 ?
                `All ${checks.length} checks passed. You can close this tab.` :
                `${failed} of ${checks.length} checks failed.`;
        }

        /**
         * @param {{name: string, ok: boolean, error?: string, info?: string}[]} checks
         */
        async function send(checks) {
            render(checks);
            await fetch('/results', {method: 'POST', body: JSON.stringify(checks)});
        }

        /**
         * The owner-side checks hold the SAH-Pool for the dedicated worker's whole life, so the
         * page-side (proxy) checks can only run once that worker is gone and its exclusive OPFS
         * handles are released.
         * @param {{name: string, ok: boolean, error?: string, info?: string}[]} workerChecks
         */
        async function runPageChecksAfterWorker(workerChecks) {
            let pageChecks;
            try {
                const {runPageChecks} = await import('/test/safari/page-checks.js');
                pageChecks = await runPageChecks();
            } catch (e) {
                pageChecks = [{name: 'page (proxy) checks ran', ok: false, error: e instanceof Error ? `${e.message}\n${e.stack ?? ''}` : String(e)}];
            }
            await send([...workerChecks, ...pageChecks]);
        }

        const worker = new Worker('/test/safari/worker.js', {type: 'module'});
        worker.addEventListener('message', (event) => {
            const workerChecks = event.data;
            worker.terminate();
            // Give WebKit a moment to actually drop the terminated worker's sync access handles
            // before the SharedWorker tries to acquire the same pool.
            setTimeout(() => { void runPageChecksAfterWorker(workerChecks); }, 500);
        });
        worker.addEventListener('error', (event) => {
            void send([{name: 'worker started', ok: false, error: `${event.message} (${event.filename}:${event.lineno})`}]);
        });
    </script>
</body>
</html>
